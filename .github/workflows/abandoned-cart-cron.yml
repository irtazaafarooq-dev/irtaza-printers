name: Abandoned Cart Notifications

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call abandoned cart endpoint
        run: |
          curl -X GET "https://irtazaprinters.com/api/cron/abandoned-cart" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"